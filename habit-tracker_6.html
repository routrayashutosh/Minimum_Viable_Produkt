<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimum Viable Produkt</title>
<style>
  :root{
    --bg:#faf9f6;
    --ink:#222222;
    --muted:#8a8a8a;
    --line:#e2e0da;
    --line-strong:#c9c6bd;
    --card:#ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05);
    --radius:14px;
    --zebra:#f5f4f0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .titlebar{
    height:38px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:linear-gradient(to bottom, #fbfaf7, #f3f2ee);
    border-bottom:1px solid var(--line);
    gap:8px;
    position:sticky; top:0; z-index:50;
  }
  .dot{width:12px;height:12px;border-radius:50%;}
  .dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
  .titlebar .app-name{margin-left:10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;}

  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:28px 28px 80px;
  }

  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:.3px;
  }
  .subtitle{color:var(--muted); font-size:13px; margin-bottom:22px;}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:24px;
  }

  .panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .panel-header h2{
    font-size:15px;
    margin:0;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:#4a4a4a;
  }
  input.panel-title-input{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:#4a4a4a;
    border:none;
    background:transparent;
    padding:3px 4px;
    border-radius:6px;
    min-width:80px;
    max-width:420px;
  }
  input.panel-title-input:focus{background:#f1efe9;}

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .controls label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  input[type=number], input[type=text]{
    font-family:inherit;
    font-size:13px;
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type=number]{width:64px;}
  input[type=text]{width:190px;}
  input:focus{border-color:#b7b3a8;}

  button{
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    transition:transform .05s ease, background .15s ease;
  }
  button:hover{background:#f1efe9;}
  button:active{transform:scale(0.97);}
  button.primary{
    background:#222222;
    color:#fff;
    border-color:#222222;
  }
  button.primary:hover{background:#000;}
  button.subtle{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:4px 6px;
  }
  button.subtle:hover{color:#c0392b; background:transparent;}

  /* ---------- Habit Grid ---------- */
  .grid-scroll{
    overflow-x:auto;
    padding-bottom:6px;
  }
  table.tracker{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
  }
  table.tracker th, table.tracker td{
    text-align:center;
    white-space:nowrap;
  }
  .day-col{
    width:38px;
    min-width:38px;
    max-width:38px;
  }
  .habit-col{
    text-align:left !important;
    min-width:220px;
    max-width:260px;
    position:sticky;
    left:0;
    background:var(--card);
    z-index:5;
  }
  th.day-num{
    font-size:13px;
    font-style:italic;
    font-weight:700;
    color:#444;
    padding:0 2px 6px;
    font-variant-numeric: tabular-nums;
  }
  th.progress-cell{
    font-size:10.5px;
    font-weight:700;
    color:#999;
    padding:4px 2px 2px;
    font-variant-numeric: tabular-nums;
  }
  .habit-header-cell{
    border-bottom:2px solid var(--line-strong);
    vertical-align:bottom;
    padding-bottom:8px;
  }
  .habit-row td, .habit-row th{
    padding:5px 2px;
    border-bottom:1px dotted var(--line);
  }
  .zebra td, .zebra th{ background:var(--zebra); }
  .habit-name-cell{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 6px;
  }
  .habit-name-cell input.hname{
    border:none;
    background:transparent;
    font-family:"SF Mono", ui-monospace, Menlo, monospace;
    font-size:13px;
    width:100%;
    padding:2px 2px;
    border-radius:5px;
  }
  .habit-name-cell input.hname:focus{background:#f1efe9;}
  .habit-name-cell .del{
    opacity:0;
    transition:opacity .1s;
  }
  .habit-row:hover .del{opacity:1;}

  .box{
    width:20px;height:20px;
    border-radius:5px;
    border:2px solid #b9b6ad;
    display:inline-block;
    cursor:pointer;
    position:relative;
    background:#fff;
  }
  .box.on{
    background:#333333;
    border-color:#333333;
  }
  .box.on::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:6px; height:11px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  /* ---------- Section rows ---------- */
  tr.section-row td, tr.section-row th{
    border-bottom:2px solid var(--line-strong);
    padding-top:16px;
  }
  .section-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 6px;
  }
  .section-header input.sname{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.8px;
    width:100%;
    padding:2px 2px;
    border-radius:5px;
    color:#222;
  }
  .section-header input.sname:focus{background:#f1efe9;}
  .section-blank-cell{ background:transparent; }

  tr.add-habit-row td{
    border-bottom:1px solid var(--line);
    padding:6px 2px 12px;
  }
  .add-habit-inline{
    display:flex;
    gap:6px;
    padding:2px 6px;
  }
  .add-habit-inline input[type=text]{
    width:100%;
    font-size:12.5px;
    padding:5px 8px;
  }
  .add-habit-inline button{
    padding:5px 10px;
    font-size:12px;
    white-space:nowrap;
  }

  .add-section-row{
    margin-top:14px;
    display:flex;
    gap:8px;
  }

  .tracker-panel-body.collapsed{ display:none; }
  .add-tracker-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .add-tracker-row input[type=text]{ width:240px; }

  /* ---------- Today Tasks ---------- */
  .task-list{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column;
    gap:6px;
  }
  .task-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    transition: opacity .3s ease, transform .3s ease;
  }
  .task-item.done{
    background:#f6f5f1;
  }
  .task-item.done .task-text{
    text-decoration:line-through;
    color:var(--muted);
  }
  .task-check{
    width:19px;height:19px;
    border-radius:50%;
    border:2px solid #bbb;
    cursor:pointer;
    flex:0 0 auto;
    position:relative;
    background:#fff;
  }
  .task-check.on{
    background:#333333;
    border-color:#333333;
  }
  .task-check.on::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:10px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .task-text{
    flex:1;
    font-size:13.5px;
  }
  .task-add{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .task-add input[type=text]{width:100%; flex:1;}
  .empty-hint{
    color:var(--muted);
    font-size:12.5px;
    padding:8px 2px;
  }
  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    margin-top:28px;
  }

  /* ---------- Top row (Tasks + Money Goals side by side) ---------- */
  .top-row{
    display:flex;
    gap:24px;
    align-items:stretch;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .top-row > .panel{
    flex:1 1 380px;
    margin-bottom:0;
  }

  /* ---------- Money Goals ---------- */
  .goals-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .goal-card{
    width:168px;
    height:168px;
    perspective:1000px;
    cursor:pointer;
  }
  .goal-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .goal-card.flipped .goal-inner{
    transform:rotateY(180deg);
  }
  .goal-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px;
    text-align:center;
  }
  .goal-back{
    transform:rotateY(180deg);
    justify-content:flex-start;
    gap:6px;
    cursor:default;
  }
  .goal-ring{
    width:88px;
    height:88px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: conic-gradient(var(--goal-color,#b5563a) calc(var(--pct,0)*1%), var(--line-strong) 0);
    margin-bottom:8px;
    transition: background .35s ease;
  }
  .goal-ring-inner{
    width:76px;
    height:76px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .goal-pct{ font-size:15px; font-weight:700; }
  .goal-name{
    font-size:12.5px; font-weight:600; margin-top:2px;
    max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .goal-amounts{ font-size:10.5px; color:var(--muted); margin-top:2px; }

  .goal-back-title{
    font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.5px; color:var(--muted); align-self:flex-start; margin-bottom:2px;
  }
  .goal-back input[type=text], .goal-back input[type=number]{
    width:100%;
    font-size:12.5px;
    padding:5px 7px;
  }
  .goal-back-row{ display:flex; gap:4px; width:100%; }
  .goal-back-row input{ min-width:0; }
  .goal-back-row button{ padding:5px 9px; font-size:13px; flex:0 0 auto; font-weight:700; }
  .goal-back-footer{ display:flex; justify-content:space-between; width:100%; margin-top:auto; }
  .goal-back-footer button{ font-size:10.5px; padding:4px 7px; }

  .add-goal-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .add-goal-row input[type=text]{ width:160px; }
  .add-goal-row input[type=number]{ width:130px; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  <div class="app-name">Minimum Viable Produkt</div>
</div>

<div class="wrap">
  <h1>Minimum Viable Produkt</h1>
  <div class="subtitle">Group habits into sections, track any number of days, and keep a separate list for today's one-off tasks.</div>

  <div class="top-row">
    <!-- TODAY TASKS PANEL -->
    <div class="panel" id="tasksPanel">
      <div class="panel-header">
        <h2>Today's Tasks</h2>
        <div class="controls">
          <button id="clearDoneBtn">Clear completed</button>
          <button id="toggleTasksBtn">Hide</button>
        </div>
      </div>

      <div id="tasksBody">
        <ul class="task-list" id="taskList"></ul>
        <div class="task-add">
          <input type="text" id="newTaskInput" placeholder="Add a task for today...">
          <button id="addTaskBtn" class="primary">Add</button>
        </div>
      </div>
    </div>

    <!-- MONEY GOALS PANEL -->
    <div class="panel" id="goalsPanel">
      <div class="panel-header">
        <h2>Money Goals</h2>
        <div class="controls">
          <button id="toggleGoalsBtn">Hide</button>
        </div>
      </div>

      <div id="goalsBody">
        <div class="goals-grid" id="goalsGrid"></div>
        <div class="add-goal-row">
          <input type="text" id="newGoalName" placeholder="Goal name (e.g. iPhone)...">
          <input type="number" id="newGoalTarget" placeholder="Target ₹" min="1">
          <button id="addGoalBtn" class="primary">+ Add goal</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HABIT TRACKER PANELS (dynamic) -->
  <div id="trackersContainer"></div>

  <div class="add-tracker-row">
    <input type="text" id="newTrackerInput" placeholder="New panel name (e.g. Habits, Reading List)...">
    <button id="addTrackerBtn" class="primary">+ Add panel</button>
  </div>

  <div class="footer-note">Saved automatically on this device.</div>
</div>

<script>
(function(){
  const STORAGE_KEY = "habit-tracker-data-v3";
  const V2_STORAGE_KEY = "habit-tracker-data-v2";
  const V1_STORAGE_KEY = "habit-tracker-data-v1";

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function freshDefault(){
    return {
      trackers: [
        {
          id: uid(),
          title: "Habits",
          numDays: 31,
          collapsed: false,
          sections: [
            {
              id: uid(),
              name: "75 Hard",
              habits: [
                {id: uid(), name: "Clean diet"},
                {id: uid(), name: "4 litres water"},
                {id: uid(), name: "45' workout"},
                {id: uid(), name: "Read 10 pages"},
              ]
            },
            {
              id: uid(),
              name: "Winter Arc",
              habits: [
                {id: uid(), name: "4 hours deep work"},
                {id: uid(), name: "7 hours sleep"},
              ]
            }
          ]
        }
      ],
      checks: {},
      tasks: [],
      tasksCollapsed: false,
      moneyGoals: [],
      goalsCollapsed: false
    };
  }

  // Migrate v2 (single tracker, no panel title/collapse) into v3 (multiple named, collapsible trackers)
  function migrateV2(parsed){
    return {
      trackers: [{
        id: uid(),
        title: "Habits",
        numDays: parsed.numDays || 31,
        collapsed: false,
        sections: parsed.sections || []
      }],
      checks: parsed.checks || {},
      tasks: parsed.tasks || [],
      tasksCollapsed: !!parsed.tasksCollapsed,
      moneyGoals: [],
      goalsCollapsed: false
    };
  }

  // Migrate v1 (flat habit list) all the way into v3
  function migrateV1(parsed){
    if(!parsed.habits) return null;
    return {
      trackers: [{
        id: uid(),
        title: "Habits",
        numDays: parsed.numDays || 31,
        collapsed: false,
        sections: [{ id: uid(), name: "Habits", habits: parsed.habits }]
      }],
      checks: parsed.checks || {},
      tasks: parsed.tasks || [],
      tasksCollapsed: false,
      moneyGoals: [],
      goalsCollapsed: false
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.warn("load failed", e); }
    try{
      const rawV2 = localStorage.getItem(V2_STORAGE_KEY);
      if(rawV2) return migrateV2(JSON.parse(rawV2));
    }catch(e){ console.warn("v2 migration failed", e); }
    try{
      const rawV1 = localStorage.getItem(V1_STORAGE_KEY);
      if(rawV1){
        const migrated = migrateV1(JSON.parse(rawV1));
        if(migrated) return migrated;
      }
    }catch(e){ console.warn("v1 migration failed", e); }
    return freshDefault();
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("save failed", e); }
  }

  let state = load();
  if(!Array.isArray(state.moneyGoals)) state.moneyGoals = [];
  if(typeof state.goalsCollapsed !== 'boolean') state.goalsCollapsed = false;

  function allHabitsIn(tracker){
    return tracker.sections.flatMap(s => s.habits);
  }

  // ---------- HABIT TRACKER PANELS RENDER ----------
  // Builds the <table> of sections/habits/checkboxes for a single tracker panel.
  function buildTrackerTable(tracker){
    const table = document.createElement('table');
    table.className = 'tracker';
    const numDays = tracker.numDays;
    const habits = allHabitsIn(tracker);
    const totalHabits = habits.length;

    habits.forEach(h=>{
      if(!state.checks[h.id]) state.checks[h.id] = {};
    });

    // Row 1: progress percentage per day
    const trProgress = document.createElement('tr');
    const thProgLabel = document.createElement('th');
    thProgLabel.className = 'habit-col';
    thProgLabel.textContent = 'Progress';
    thProgLabel.style.fontSize = '10.5px';
    thProgLabel.style.color = '#999';
    thProgLabel.style.fontWeight = '700';
    thProgLabel.style.textTransform = 'uppercase';
    thProgLabel.style.letterSpacing = '0.6px';
    trProgress.appendChild(thProgLabel);
    for(let i=0;i<numDays;i++){
      const th = document.createElement('th');
      th.className = 'progress-cell day-col';
      if(totalHabits === 0){
        th.textContent = '—';
      } else {
        let checkedCount = 0;
        habits.forEach(h=>{ if(state.checks[h.id][i]) checkedCount++; });
        const pct = Math.round((checkedCount/totalHabits)*100);
        th.textContent = pct + '%';
      }
      trProgress.appendChild(th);
    }
    table.appendChild(trProgress);

    // Row 2: day numbers
    const trNum = document.createElement('tr');
    const thHabit3 = document.createElement('th');
    thHabit3.className = 'habit-col habit-header-cell';
    trNum.appendChild(thHabit3);
    for(let i=0;i<numDays;i++){
      const th = document.createElement('th');
      th.className = 'day-num habit-header-cell day-col';
      th.textContent = (i+1);
      trNum.appendChild(th);
    }
    table.appendChild(trNum);

    // Sections
    tracker.sections.forEach((section, sIdx)=>{
      // Section header row (no checkboxes)
      const trSection = document.createElement('tr');
      trSection.className = 'section-row';

      const tdSecName = document.createElement('td');
      tdSecName.className = 'habit-col';
      const secWrap = document.createElement('div');
      secWrap.className = 'section-header';
      const secInput = document.createElement('input');
      secInput.className = 'sname';
      secInput.type = 'text';
      secInput.value = section.name;
      secInput.addEventListener('change', ()=>{
        section.name = secInput.value;
        save();
      });
      const secDel = document.createElement('button');
      secDel.className = 'subtle del';
      secDel.textContent = '✕';
      secDel.title = 'Delete section';
      secDel.addEventListener('click', ()=>{
        if(!confirm('Delete "' + section.name + '" and all its habits?')) return;
        section.habits.forEach(h=> delete state.checks[h.id]);
        tracker.sections = tracker.sections.filter(s=>s.id !== section.id);
        save();
        renderAllTrackers();
      });
      secWrap.appendChild(secInput);
      secWrap.appendChild(secDel);
      tdSecName.appendChild(secWrap);
      trSection.appendChild(tdSecName);

      const tdSecBlank = document.createElement('td');
      tdSecBlank.className = 'section-blank-cell';
      tdSecBlank.colSpan = numDays;
      trSection.appendChild(tdSecBlank);

      table.appendChild(trSection);

      // Habit rows for this section
      section.habits.forEach((habit, hIdx)=>{
        const tr = document.createElement('tr');
        tr.className = 'habit-row' + (hIdx % 2 === 1 ? ' zebra' : '');

        const tdName = document.createElement('td');
        tdName.className = 'habit-col';
        const wrap = document.createElement('div');
        wrap.className = 'habit-name-cell';
        const input = document.createElement('input');
        input.className = 'hname';
        input.type = 'text';
        input.value = habit.name;
        input.addEventListener('change', ()=>{
          habit.name = input.value;
          save();
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'subtle del';
        delBtn.textContent = '✕';
        delBtn.title = 'Delete habit';
        delBtn.addEventListener('click', ()=>{
          section.habits = section.habits.filter(h=>h.id !== habit.id);
          delete state.checks[habit.id];
          save();
          renderAllTrackers();
        });
        wrap.appendChild(input);
        wrap.appendChild(delBtn);
        tdName.appendChild(wrap);
        tr.appendChild(tdName);

        for(let i=0;i<numDays;i++){
          const td = document.createElement('td');
          td.className = 'day-col';
          const box = document.createElement('span');
          const on = !!state.checks[habit.id][i];
          box.className = 'box' + (on ? ' on' : '');
          box.addEventListener('click', ()=>{
            state.checks[habit.id][i] = !state.checks[habit.id][i];
            save();
            renderAllTrackers();
          });
          td.appendChild(box);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      });

      // Add-habit row for this section
      const trAdd = document.createElement('tr');
      trAdd.className = 'add-habit-row';
      const tdAddName = document.createElement('td');
      tdAddName.className = 'habit-col';
      const addWrap = document.createElement('div');
      addWrap.className = 'add-habit-inline';
      const addInput = document.createElement('input');
      addInput.type = 'text';
      addInput.placeholder = '+ Add habit...';
      const addBtn = document.createElement('button');
      addBtn.textContent = 'Add';
      function doAdd(){
        const name = addInput.value.trim();
        if(!name) return;
        section.habits.push({id: uid(), name});
        addInput.value = '';
        save();
        renderAllTrackers();
      }
      addBtn.addEventListener('click', doAdd);
      addInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') doAdd(); });
      addWrap.appendChild(addInput);
      addWrap.appendChild(addBtn);
      tdAddName.appendChild(addWrap);
      trAdd.appendChild(tdAddName);
      const tdAddBlank = document.createElement('td');
      tdAddBlank.colSpan = numDays;
      trAdd.appendChild(tdAddBlank);
      table.appendChild(trAdd);
    });

    return table;
  }

  // Builds one full panel (header + collapsible body) for a tracker.
  function buildTrackerPanel(tracker){
    const panel = document.createElement('div');
    panel.className = 'panel';

    // ---- header ----
    const header = document.createElement('div');
    header.className = 'panel-header';

    const titleInput = document.createElement('input');
    titleInput.className = 'panel-title-input';
    titleInput.type = 'text';
    titleInput.value = tracker.title;
    titleInput.title = 'Rename this panel';
    titleInput.addEventListener('change', ()=>{
      const val = titleInput.value.trim();
      tracker.title = val || 'Untitled';
      titleInput.value = tracker.title;
      save();
    });
    header.appendChild(titleInput);

    const controls = document.createElement('div');
    controls.className = 'controls';

    const daysLabel = document.createElement('label');
    daysLabel.textContent = 'Days';
    const daysInput = document.createElement('input');
    daysInput.type = 'number';
    daysInput.min = '1';
    daysInput.max = '366';
    daysInput.value = tracker.numDays;
    daysLabel.appendChild(daysInput);
    controls.appendChild(daysLabel);

    const genBtn = document.createElement('button');
    genBtn.className = 'primary';
    genBtn.textContent = 'Generate';
    genBtn.addEventListener('click', ()=>{
      const nd = parseInt(daysInput.value, 10);
      tracker.numDays = (isNaN(nd) || nd < 1) ? 1 : Math.min(nd, 366);
      save();
      renderAllTrackers();
    });
    controls.appendChild(genBtn);

    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = tracker.collapsed ? 'Show' : 'Hide';
    toggleBtn.addEventListener('click', ()=>{
      tracker.collapsed = !tracker.collapsed;
      save();
      renderAllTrackers();
    });
    controls.appendChild(toggleBtn);

    const delPanelBtn = document.createElement('button');
    delPanelBtn.className = 'subtle del';
    delPanelBtn.style.opacity = '1';
    delPanelBtn.textContent = '✕';
    delPanelBtn.title = 'Delete this panel';
    delPanelBtn.addEventListener('click', ()=>{
      if(!confirm('Delete the "' + tracker.title + '" panel and everything in it?')) return;
      allHabitsIn(tracker).forEach(h=> delete state.checks[h.id]);
      state.trackers = state.trackers.filter(t=>t.id !== tracker.id);
      save();
      renderAllTrackers();
    });
    controls.appendChild(delPanelBtn);

    header.appendChild(controls);
    panel.appendChild(header);

    // ---- body (collapsible) ----
    const body = document.createElement('div');
    body.className = 'tracker-panel-body' + (tracker.collapsed ? ' collapsed' : '');

    const gridScroll = document.createElement('div');
    gridScroll.className = 'grid-scroll';
    gridScroll.appendChild(buildTrackerTable(tracker));
    body.appendChild(gridScroll);

    const addSectionRow = document.createElement('div');
    addSectionRow.className = 'add-section-row';
    const newSectionInput = document.createElement('input');
    newSectionInput.type = 'text';
    newSectionInput.placeholder = 'New section name (e.g. 75 Hard)...';
    const addSectionBtn = document.createElement('button');
    addSectionBtn.textContent = '+ Add section';
    function doAddSection(){
      const name = newSectionInput.value.trim();
      if(!name) return;
      tracker.sections.push({id: uid(), name, habits: []});
      newSectionInput.value = '';
      save();
      renderAllTrackers();
    }
    addSectionBtn.addEventListener('click', doAddSection);
    newSectionInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') doAddSection(); });
    addSectionRow.appendChild(newSectionInput);
    addSectionRow.appendChild(addSectionBtn);
    body.appendChild(addSectionRow);

    panel.appendChild(body);
    return panel;
  }

  function renderAllTrackers(){
    const container = document.getElementById('trackersContainer');
    container.innerHTML = "";
    state.trackers.forEach(tracker=>{
      container.appendChild(buildTrackerPanel(tracker));
    });
  }

  document.getElementById('addTrackerBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('newTrackerInput');
    const name = inp.value.trim();
    if(!name) return;
    state.trackers.push({id: uid(), title: name, numDays: 31, collapsed: false, sections: []});
    inp.value = "";
    save();
    renderAllTrackers();
  });
  document.getElementById('newTrackerInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('addTrackerBtn').click();
  });

  // ---------- TODAY TASKS RENDER ----------
  function renderTasks(){
    const list = document.getElementById('taskList');
    list.innerHTML = "";
    if(state.tasks.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = "Nothing on today's list yet.";
      list.appendChild(hint);
      return;
    }
    state.tasks.forEach(task=>{
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      const check = document.createElement('span');
      check.className = 'task-check' + (task.done ? ' on' : '');
      check.addEventListener('click', ()=>{
        task.done = !task.done;
        state.tasks.sort((a,b)=> (a.done === b.done) ? 0 : (a.done ? 1 : -1));
        save();
        renderTasks();
      });

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'subtle del';
      del.style.opacity = '1';
      del.textContent = '✕';
      del.addEventListener('click', ()=>{
        state.tasks = state.tasks.filter(t=>t.id !== task.id);
        save();
        renderTasks();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  document.getElementById('addTaskBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('newTaskInput');
    const text = inp.value.trim();
    if(!text) return;
    const firstDoneIdx = state.tasks.findIndex(t=>t.done);
    const newTask = {id: uid(), text, done:false};
    if(firstDoneIdx === -1){
      state.tasks.push(newTask);
    } else {
      state.tasks.splice(firstDoneIdx, 0, newTask);
    }
    inp.value = "";
    save();
    renderTasks();
  });
  document.getElementById('newTaskInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('addTaskBtn').click();
  });

  document.getElementById('clearDoneBtn').addEventListener('click', ()=>{
    state.tasks = state.tasks.filter(t=>!t.done);
    save();
    renderTasks();
  });

  // ---------- Collapse Today's Tasks ----------
  function applyTasksCollapsed(){
    const body = document.getElementById('tasksBody');
    const btn = document.getElementById('toggleTasksBtn');
    if(state.tasksCollapsed){
      body.style.display = 'none';
      btn.textContent = 'Show';
    } else {
      body.style.display = '';
      btn.textContent = 'Hide';
    }
  }
  document.getElementById('toggleTasksBtn').addEventListener('click', ()=>{
    state.tasksCollapsed = !state.tasksCollapsed;
    save();
    applyTasksCollapsed();
  });

  // ---------- MONEY GOALS ----------
  function fmtMoney(n){
    const num = Math.round(Number(n) || 0);
    return '₹' + num.toLocaleString('en-IN');
  }

  function buildGoalCard(goal){
    const target = Math.max(0, Number(goal.target) || 0);
    const current = Math.max(0, Number(goal.current) || 0);
    const rawPct = target > 0 ? Math.round((current / target) * 100) : 0;
    const ringPct = Math.min(100, rawPct);
    const complete = target > 0 && current >= target;

    const card = document.createElement('div');
    card.className = 'goal-card';

    const inner = document.createElement('div');
    inner.className = 'goal-inner';

    // ---- front: circular progress ----
    const front = document.createElement('div');
    front.className = 'goal-face goal-front';

    const ring = document.createElement('div');
    ring.className = 'goal-ring';
    ring.style.setProperty('--pct', ringPct);
    ring.style.setProperty('--goal-color', complete ? '#5b8a5a' : '#b5563a');

    const ringInner = document.createElement('div');
    ringInner.className = 'goal-ring-inner';
    const pctText = document.createElement('div');
    pctText.className = 'goal-pct';
    pctText.textContent = rawPct + '%';
    ringInner.appendChild(pctText);
    ring.appendChild(ringInner);
    front.appendChild(ring);

    const nameEl = document.createElement('div');
    nameEl.className = 'goal-name';
    nameEl.textContent = goal.name;
    front.appendChild(nameEl);

    const amountsEl = document.createElement('div');
    amountsEl.className = 'goal-amounts';
    amountsEl.textContent = fmtMoney(current) + ' / ' + fmtMoney(target);
    front.appendChild(amountsEl);

    front.addEventListener('click', ()=>{
      card.classList.add('flipped');
    });

    // ---- back: add / subtract / rename / delete ----
    const back = document.createElement('div');
    back.className = 'goal-face goal-back';
    back.addEventListener('click', e => e.stopPropagation());

    const backTitle = document.createElement('div');
    backTitle.className = 'goal-back-title';
    backTitle.textContent = 'Edit goal';
    back.appendChild(backTitle);

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = goal.name;
    nameInput.placeholder = 'Goal name';
    nameInput.addEventListener('change', ()=>{
      goal.name = nameInput.value.trim() || 'Goal';
      nameInput.value = goal.name;
      save();
      renderGoals();
    });
    back.appendChild(nameInput);

    const targetInput = document.createElement('input');
    targetInput.type = 'number';
    targetInput.min = '0';
    targetInput.value = target;
    targetInput.placeholder = 'Target ₹';
    targetInput.addEventListener('change', ()=>{
      const v = parseFloat(targetInput.value);
      goal.target = (isNaN(v) || v < 0) ? 0 : v;
      save();
      renderGoals();
    });
    back.appendChild(targetInput);

    const amountRow = document.createElement('div');
    amountRow.className = 'goal-back-row';

    const amountInput = document.createElement('input');
    amountInput.type = 'number';
    amountInput.min = '0';
    amountInput.placeholder = 'Amount ₹';
    amountRow.appendChild(amountInput);

    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    addBtn.title = 'Add amount';
    addBtn.addEventListener('click', ()=>{
      const v = parseFloat(amountInput.value);
      if(!isNaN(v) && v > 0){
        goal.current = Math.max(0, (Number(goal.current) || 0) + v);
        amountInput.value = '';
        save();
        renderGoals();
      }
    });
    amountRow.appendChild(addBtn);

    const subBtn = document.createElement('button');
    subBtn.textContent = '−';
    subBtn.title = 'Subtract amount';
    subBtn.addEventListener('click', ()=>{
      const v = parseFloat(amountInput.value);
      if(!isNaN(v) && v > 0){
        goal.current = Math.max(0, (Number(goal.current) || 0) - v);
        amountInput.value = '';
        save();
        renderGoals();
      }
    });
    amountRow.appendChild(subBtn);
    amountInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') addBtn.click(); });
    back.appendChild(amountRow);

    const footer = document.createElement('div');
    footer.className = 'goal-back-footer';

    const delBtn = document.createElement('button');
    delBtn.className = 'subtle del';
    delBtn.style.opacity = '1';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', ()=>{
      if(!confirm('Delete the "' + goal.name + '" goal?')) return;
      state.moneyGoals = state.moneyGoals.filter(g=>g.id !== goal.id);
      save();
      renderGoals();
    });
    footer.appendChild(delBtn);

    const backBtn = document.createElement('button');
    backBtn.textContent = '← Back';
    backBtn.addEventListener('click', ()=>{
      card.classList.remove('flipped');
    });
    footer.appendChild(backBtn);

    back.appendChild(footer);

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    return card;
  }

  function renderGoals(){
    const grid = document.getElementById('goalsGrid');
    grid.innerHTML = "";
    if(state.moneyGoals.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'No money goals yet — add one below.';
      grid.appendChild(hint);
      return;
    }
    state.moneyGoals.forEach(goal=>{
      grid.appendChild(buildGoalCard(goal));
    });
  }

  document.getElementById('addGoalBtn').addEventListener('click', ()=>{
    const nameInp = document.getElementById('newGoalName');
    const targetInp = document.getElementById('newGoalTarget');
    const name = nameInp.value.trim();
    const target = parseFloat(targetInp.value);
    if(!name || isNaN(target) || target <= 0) return;
    state.moneyGoals.push({id: uid(), name, target, current: 0});
    nameInp.value = '';
    targetInp.value = '';
    save();
    renderGoals();
  });
  document.getElementById('newGoalName').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('newGoalTarget').focus();
  });
  document.getElementById('newGoalTarget').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('addGoalBtn').click();
  });

  // ---------- Collapse Money Goals ----------
  function applyGoalsCollapsed(){
    const body = document.getElementById('goalsBody');
    const btn = document.getElementById('toggleGoalsBtn');
    if(state.goalsCollapsed){
      body.style.display = 'none';
      btn.textContent = 'Show';
    } else {
      body.style.display = '';
      btn.textContent = 'Hide';
    }
  }
  document.getElementById('toggleGoalsBtn').addEventListener('click', ()=>{
    state.goalsCollapsed = !state.goalsCollapsed;
    save();
    applyGoalsCollapsed();
  });

  // ---------- INIT ----------
  renderAllTrackers();
  renderTasks();
  applyTasksCollapsed();
  renderGoals();
  applyGoalsCollapsed();
  save();
})();
</script>

</body>
</html>
